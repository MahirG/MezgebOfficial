name: Prepare Biloo Mezgeb migration source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prepare-biloo-mezgeb-source
  cancel-in-progress: true

jobs:
  prepare:
    if: github.head_ref == 'archive/biloo-mezgeb-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preserved migration source
        uses: actions/checkout@v4
        with:
          ref: archive/biloo-mezgeb-source

      - name: Apply React 19-safe synchronization patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mobile = Path('components/mezgeb-mobile-controls.tsx')
          text = mobile.read_text(encoding='utf-8')
          old = """  useEffect(() => {
            const savedLocale = window.localStorage.getItem('mezgeb-app-locale') as Locale | null;
            if (savedLocale && localeOptions.some((option) => option.id === savedLocale))
              setLocale(savedLocale);

            const savedTheme = window.localStorage.getItem('mezgeb-app-theme') as Theme | null;
            const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
            setTheme(savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : preferredTheme);
          }, []);
          """
          new = """  useEffect(() => {
            const hydrationTimer = window.setTimeout(() => {
              const savedLocale = window.localStorage.getItem('mezgeb-app-locale') as Locale | null;
              if (savedLocale && localeOptions.some((option) => option.id === savedLocale)) {
                setLocale(savedLocale);
              }

              const savedTheme = window.localStorage.getItem('mezgeb-app-theme') as Theme | null;
              const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
              setTheme(savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : preferredTheme);
            }, 0);

            return () => window.clearTimeout(hydrationTimer);
          }, []);
          """
          if 'const hydrationTimer' not in text:
              if old not in text:
                  raise SystemExit('Locale/theme hydration pattern not found')
              text = text.replace(old, new, 1)

          old = """  useEffect(() => {
            if (!searchOpen) return;
            void loadSearchData();
            window.setTimeout(() => inputRef.current?.focus(), 80);
          }, [loadSearchData, searchOpen]);
          """
          new = """  useEffect(() => {
            if (!searchOpen) return;

            const searchTimer = window.setTimeout(() => {
              void loadSearchData();
              inputRef.current?.focus();
            }, 80);

            return () => window.clearTimeout(searchTimer);
          }, [loadSearchData, searchOpen]);
          """
          if 'const searchTimer' not in text:
              if old not in text:
                  raise SystemExit('Search hydration pattern not found')
              text = text.replace(old, new, 1)
          mobile.write_text(text, encoding='utf-8')

          pricing = Path('components/pricing-section.tsx')
          text = pricing.read_text(encoding='utf-8')
          old = """    const requestedBilling = params.get('billing');
            if (requestedBilling === 'monthly' || requestedBilling === 'annual')
              setBillingCycle(requestedBilling);

            setSelectedPlan(requestedPlan);
            setSelectedMethod('telebirr');
            setCheckoutMessage(
              params.get('pay') === '1'
                ? 'Continue below to open secure payment.'
                : params.get('trial') === '1'
                  ? 'Continue below to activate your trial.'
                  : 'Review the plan and choose how to continue.'
            );

            requestAnimationFrame(() =>
              document.getElementById('pricing')?.scrollIntoView({ block: 'start' })
            );
          """
          new = """    const requestedBilling = params.get('billing');
            const initializationTimer = window.setTimeout(() => {
              if (requestedBilling === 'monthly' || requestedBilling === 'annual') {
                setBillingCycle(requestedBilling);
              }

              setSelectedPlan(requestedPlan);
              setSelectedMethod('telebirr');
              setCheckoutMessage(
                params.get('pay') === '1'
                  ? 'Continue below to open secure payment.'
                  : params.get('trial') === '1'
                    ? 'Continue below to activate your trial.'
                    : 'Review the plan and choose how to continue.'
              );

              requestAnimationFrame(() =>
                document.getElementById('pricing')?.scrollIntoView({ block: 'start' })
              );
            }, 0);

            return () => window.clearTimeout(initializationTimer);
          """
          if 'const initializationTimer' not in text:
              if old not in text:
                  raise SystemExit('Pricing initialization pattern not found')
              text = text.replace(old, new, 1)
          pricing.write_text(text, encoding='utf-8')

          experience = Path('components/experience-orchestrator.tsx')
          text = experience.read_text(encoding='utf-8')
          text = text.replace(
              "import { useEffect, useRef, useState } from 'react';",
              "import { useCallback, useEffect, useRef, useState } from 'react';",
              1,
          )
          old = """  function ensureAudio() {
            if (audioContext.current) return audioContext.current;
            const Context = window.AudioContext || (window as AudioWindow).webkitAudioContext;
            if (!Context) return null;
            audioContext.current = new Context();
            return audioContext.current;
          }

          function playFeedback(kind: 'success' | 'error' | 'info') {
            if (!audioArmed.current || window.matchMedia('(prefers-reduced-motion: reduce)').matches)
              return;
            const context = ensureAudio();
            if (!context) return;
            void context.resume();

            const now = context.currentTime;
            const frequencies =
              kind === 'success' ? [523.25, 659.25] : kind === 'error' ? [220, 174.61] : [392];
            frequencies.forEach((frequency, index) => {
              const oscillator = context.createOscillator();
              const gain = context.createGain();
              oscillator.type = kind === 'error' ? 'triangle' : 'sine';
              oscillator.frequency.setValueAtTime(frequency, now + index * 0.08);
              gain.gain.setValueAtTime(0.0001, now + index * 0.08);
              gain.gain.exponentialRampToValueAtTime(
                kind === 'error' ? 0.055 : 0.04,
                now + index * 0.08 + 0.015
              );
              gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.08 + 0.2);
              oscillator.connect(gain);
              gain.connect(context.destination);
              oscillator.start(now + index * 0.08);
              oscillator.stop(now + index * 0.08 + 0.22);
            });
          }

          function showNetworkToast(nextToast: NonNullable<ToastState>) {
            if (toastTimer.current) clearTimeout(toastTimer.current);
            setToast(nextToast);
            toastTimer.current = setTimeout(() => setToast(null), 3600);
          }
          """
          new = """  const ensureAudio = useCallback(() => {
            if (audioContext.current) return audioContext.current;
            const Context = window.AudioContext || (window as AudioWindow).webkitAudioContext;
            if (!Context) return null;
            audioContext.current = new Context();
            return audioContext.current;
          }, []);

          const playFeedback = useCallback(
            (kind: 'success' | 'error' | 'info') => {
              if (!audioArmed.current || window.matchMedia('(prefers-reduced-motion: reduce)').matches)
                return;
              const context = ensureAudio();
              if (!context) return;
              void context.resume();

              const now = context.currentTime;
              const frequencies =
                kind === 'success' ? [523.25, 659.25] : kind === 'error' ? [220, 174.61] : [392];
              frequencies.forEach((frequency, index) => {
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.type = kind === 'error' ? 'triangle' : 'sine';
                oscillator.frequency.setValueAtTime(frequency, now + index * 0.08);
                gain.gain.setValueAtTime(0.0001, now + index * 0.08);
                gain.gain.exponentialRampToValueAtTime(
                  kind === 'error' ? 0.055 : 0.04,
                  now + index * 0.08 + 0.015
                );
                gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.08 + 0.2);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start(now + index * 0.08);
                oscillator.stop(now + index * 0.08 + 0.22);
              });
            },
            [ensureAudio]
          );

          const showNetworkToast = useCallback((nextToast: NonNullable<ToastState>) => {
            if (toastTimer.current) clearTimeout(toastTimer.current);
            setToast(nextToast);
            toastTimer.current = setTimeout(() => setToast(null), 3600);
          }, []);
          """
          if 'const ensureAudio = useCallback' not in text:
              if old not in text:
                  raise SystemExit('Feedback callback pattern not found')
              text = text.replace(old, new, 1)
          text = text.replace(
              "  }, []);\n\n  return (\n",
              "  }, [playFeedback, showNetworkToast]);\n\n  return (\n",
              1,
          )
          experience.write_text(text, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate preserved source
        run: |
          npm install --no-audit --no-fund --silent
          npm run format
          npm run lint
          npm run typecheck
          npm test
          npm run email:validate
          npm run build

      - name: Remove migration triggers
        run: rm -f .biloo-migration-react-fix .biloo-migration-source-trigger

      - name: Commit validated source preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Biloo Mezgeb migration source"
          git push origin HEAD:archive/biloo-mezgeb-source
