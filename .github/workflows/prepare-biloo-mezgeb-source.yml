name: Prepare Biloo Mezgeb migration source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prepare-biloo-mezgeb-source
  cancel-in-progress: true

jobs:
  prepare:
    if: github.head_ref == 'archive/biloo-mezgeb-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preserved migration source
        uses: actions/checkout@v7
        with:
          ref: archive/biloo-mezgeb-source

      - name: Align pricing checkout browser expectations
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('tests/smoke.spec.ts')
          text = path.read_text(encoding='utf-8')

          if ".locator('section#pricing')" not in text:
              pattern = r"(await page\s*\n\s*)(\.getByRole\('link', \{ name: /Start 14-day trial/i \}\)\s*\n\s*\.first\(\)\s*\n\s*\.click\(\);)"
              text, count = re.subn(
                  pattern,
                  r"\1.locator('section#pricing')\n    \2",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Pricing CTA test structure not found')

          expected_return = "%2F%3Fplan%3Dstarter%26billing%3Dannual%26trial%3D1%23pricing"
          if expected_return not in text:
              pattern = r"await expect\(page\)\.toHaveURL\(\s*/\\/auth\\/sign-up\\\?next=%2Fdashboard/\s*\);"
              replacement = "await expect(page).toHaveURL(\n    /\\/auth\\/sign-up\\?next=%2F%3Fplan%3Dstarter%26billing%3Dannual%26trial%3D1%23pricing/\n  );"
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Pricing checkout return URL expectation not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate preserved source
        run: |
          npm install --no-audit --no-fund --silent
          npm run format
          npm run lint
          npm run typecheck
          npm test
          npm run email:validate
          npm run build

      - name: Remove migration validation notes
        run: rm -f docs/BILOO_BROWSER_VALIDATION.md docs/BILOO_CHECKOUT_RETURN_VALIDATION.md

      - name: Commit validated browser-test expectations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align pricing checkout browser expectations"
          git push origin HEAD:archive/biloo-mezgeb-source
