name: Prepare Biloo Mezgeb migration source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prepare-biloo-mezgeb-source
  cancel-in-progress: true

jobs:
  prepare:
    if: github.head_ref == 'archive/biloo-mezgeb-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preserved migration source
        uses: actions/checkout@v4
        with:
          ref: archive/biloo-mezgeb-source

      - name: Apply React 19-safe synchronization patterns
        run: python scripts/prepare-biloo-migration.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate preserved source
        run: |
          npm install --no-audit --no-fund --silent
          npm run format
          npm run lint
          npm run typecheck
          npm test
          npm run email:validate
          npm run build

      - name: Remove migration tooling
        run: rm -f .biloo-migration-react-fix .biloo-migration-source-trigger scripts/prepare-biloo-migration.py

      - name: Commit validated source preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Biloo Mezgeb migration source"
          git push origin HEAD:archive/biloo-mezgeb-source
