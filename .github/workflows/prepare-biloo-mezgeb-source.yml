name: Prepare Biloo Mezgeb migration source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prepare-biloo-mezgeb-source
  cancel-in-progress: true

jobs:
  prepare:
    if: github.head_ref == 'archive/biloo-mezgeb-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preserved migration source
        uses: actions/checkout@v4
        with:
          ref: archive/biloo-mezgeb-source

      - name: Scope pricing checkout browser test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/smoke.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = """  await page
            .getByRole('link', { name: /Start 14-day trial/i })
            .first()
            .click();
          """
          new = """  await page
            .locator('section#pricing')
            .getByRole('link', { name: /Start 14-day trial/i })
            .first()
            .click();
          """
          if new not in text:
              if old not in text:
                  raise SystemExit('Pricing CTA test pattern not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate preserved source
        run: |
          npm install --no-audit --no-fund --silent
          npm run format
          npm run lint
          npm run typecheck
          npm test
          npm run email:validate
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Remove migration trigger
        run: rm -f .biloo-migration-browser-fix

      - name: Commit validated browser-test correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scope pricing checkout browser test"
          git push origin HEAD:archive/biloo-mezgeb-source
